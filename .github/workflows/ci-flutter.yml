name: CI - Flutter Web

on:
  pull_request:
    branches: [ main, premain ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-flutter.yml'

jobs:
  test-flutter:
    name: Flutter Lint, Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configurar Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Instalar dependencias
      - name: Install dependencies
        run: flutter pub get

      # 5. Análisis estático estricto (RNF-M-2)
      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

      # 6. Pruebas unitarias y reporte de cobertura (RNF-M-1)
      - name: Run unit tests with coverage
        run: flutter test --coverage

      # 7. Umbral de cobertura >= 80 % global y en reglas críticas (RNF-M-1, TC-39)
      - name: Check 80% coverage threshold
        run: |
          sudo apt-get install -y -qq lcov
          bash tool/cobertura.sh coverage/lcov.info coverage 80

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            frontend/coverage/html
            frontend/coverage/cobertura.json
            frontend/coverage/lcov.info

      # 8. Validar compilación release para Web
      - name: Verify Web Build
        run: flutter build web --release --no-pub